<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- كود التحقق منصة الإعلانات (Monetag) -->
    <meta name="monetag-verification" content="jecxmin1wmaz7ffmtsdqw" />

    <title>محول الصور - 4 أدوات مجانية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4f8; text-align: center; padding: 30px; }
      .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #1a237e; }
        h2 { color: #1a237e; border-bottom: 2px solid #1a237e; padding-bottom: 10px; margin-top:30px }
        input[type="file"], input[type="number"] { width: 100%; padding: 10px; border: 2px dashed #1a237e; border-radius: 10px; margin: 15px 0; }
        textarea { width: 100%; height: 150px; padding: 10px; border: 2px dashed #1a237e; border-radius: 10px; font-size: 16px; margin: 15px 0; }
        button { background: #1a237e; color: white; padding: 12px 30px; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top:10px }
        button:hover { background: #283593; }
        #preview img { max-width: 100px; border-radius: 8px; margin: 5px; }
       .download { display: none; margin-top: 20px; }
      .trust-badges { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
      .trust-badge { font-size: 14px; color: #555; }
      .counter { background: #e8eaf6; padding: 10px; border-radius: 10px; margin: 20px 0; font-weight: bold; }
      .ad-section { margin-top: 20px; padding: 10px; background: #f9f9f9; border-radius: 8px; font-size: 12px; color: #888; }
      .tool-box { border:2px solid #e0e0e0; padding:20px; border-radius:10px; margin-bottom:20px }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 محول الصور - 4 أدوات مجانية</h1>
        <div class="trust-badges">
            <span class="trust-badge">🛡️ 100% آمن</span>
            <span class="trust-badge">❌ بدون علامة مائية</span>
            <span class="trust-badge">📱 يعمل على الموبايل</span>
            <span class="trust-badge">⚡ سريع جداً</span>
        </div>
        <div class="counter">✅ تم تحويل +50,000 ملف</div>

        <!-- الأداة 1: صورة إلى PDF -->
        <div class="tool-box">
        <h2>📄 تحويل الصور إلى PDF</h2>
        <input type="file" id="imageInput" accept="image/*" multiple>
        <div id="preview"></div>
        <button onclick="goToAd('img2pdf')">🔄 تحويل إلى PDF</button>
        <div id="status"></div>
        <a id="download" class="download" download="images.pdf">📥 تحميل PDF</a>
        </div>

        <!-- الأداة 2: النص إلى PDF -->
        <div class="tool-box">
        <h2>📝 تحويل النص إلى PDF</h2>
        <textarea id="textInput" placeholder="اكتب نصك هنا..."></textarea>
        <button onclick="goToAd('text2pdf')">🔄 تحويل النص</button>
        <div id="statusText"></div>
        <a id="downloadText" class="download" download="text.pdf">📥 تحميل PDF</a>
        </div>

        <!-- الأداة 3: ضغط الصور -->
        <div class="tool-box">
        <h2>📦 ضغط الصور</h2>
        <input type="file" id="compressInput" accept="image/*">
        <input type="number" id="quality" placeholder="جودة الضغط 1-100" value="70" min="1" max="100">
        <button onclick="goToAd('compress')">🔄 ضغط الصورة</button>
        <div id="statusCompress"></div>
        <a id="downloadCompress" class="download" download="compressed.jpg">📥 تحميل الصورة المضغوطة</a>
        </div>

        <!-- الأداة 4: تغيير المقاس -->
        <div class="tool-box">
        <h2>📐 تغيير مقاس الصورة</h2>
        <input type="file" id="resizeInput" accept="image/*">
        <input type="number" id="newWidth" placeholder="العرض الجديد بالبكسل" value="800">
        <button onclick="goToAd('resize')">🔄 تغيير المقاس</button>
        <div id="statusResize"></div>
        <a id="downloadResize" class="download" download="resized.jpg">📥 تحميل الصورة</a>
        </div>

        <div class="ad-section">
            <!-- ضع كود الإعلان هنا -->
        </div>
    </div>
    <script>
        // حط لينك Linkvertise بتاعك هنا
        const LINKVERTISE = 'https://link-hub.net/6200670/XnSNDzlHKFi1?r=';

        let selectedFiles = [];
        let compressFile = null;
        let resizeFile = null;
        let pendingAction = '';

        document.getElementById('imageInput').addEventListener('change', function(e) {
            selectedFiles = Array.from(e.target.files);
            const preview = document.getElementById('preview');
            preview.innerHTML = '';
            selectedFiles.forEach(file => {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                preview.appendChild(img);
            });
        });

        document.getElementById('compressInput').addEventListener('change', function(e) {
            compressFile = e.target.files[0];
        });

        document.getElementById('resizeInput').addEventListener('change', function(e) {
            resizeFile = e.target.files[0];
        });

        // دالة الإعلان
        function goToAd(action) {
            pendingAction = action;

            if(action === 'img2pdf' && selectedFiles.length === 0) {
                alert('اختر صورة واحدة على الأقل.');
                return;
            }
            if(action === 'text2pdf' && document.getElementById('textInput').value.trim() === '') {
                alert('اكتب نصاً أولاً.');
                return;
            }
            if(action === 'compress' &&!compressFile) {
                alert('اختر صورة للضغط.');
                return;
            }
            if(action === 'resize' &&!resizeFile) {
                alert('اختر صورة لتغيير مقاسها.');
                return;
            }

            localStorage.setItem('pendingAction', action);
            if(action === 'text2pdf') {
                localStorage.setItem('savedText', document.getElementById('textInput').value);
            }
            if(action === 'compress') {
                localStorage.setItem('compressQuality', document.getElementById('quality').value);
            }
            if(action === 'resize') {
                localStorage.setItem('resizeWidth', document.getElementById('newWidth').value);
            }

            window.location.href = LINKVERTISE + encodeURIComponent(window.location.href + '#done');
        }

        // لما نرجع من Linkvertise
        window.onload = async function() {
            const action = localStorage.getItem('pendingAction');
            if(window.location.hash === '#done' && action) {
                localStorage.removeItem('pendingAction');

                if(action === 'img2pdf') await convertToPDF();
                else if(action === 'text2pdf') {
                    const savedText = localStorage.getItem('savedText');
                    document.getElementById('textInput').value = savedText;
                    localStorage.removeItem('savedText');
                    await convertText();
                }
                else if(action === 'compress') {
                    const quality = localStorage.getItem('compressQuality');
                    localStorage.removeItem('compressQuality');
                    await compressImage(quality);
                }
                else if(action === 'resize') {
                    const width = localStorage.getItem('resizeWidth');
                    localStorage.removeItem('resizeWidth');
                    await resizeImage(width);
                }
            }
        }

        // الأداة 1
        async function convertToPDF() {
            const status = document.getElementById('status');
            const downloadLink = document.getElementById('download');
            status.textContent = '⏳ جاري التحويل...';
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                const imgData = await new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
                if (i > 0) pdf.addPage();
                const imgProps = pdf.getImageProperties(imgData);
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
            }
            const pdfBlob = pdf.output('blob');
            const url = URL.createObjectURL(pdfBlob);
            downloadLink.href = url;
            downloadLink.style.display = 'inline-block';
            status.textContent = '✅ تم التحويل بنجاح!';
        }

        // الأداة 2
        async function convertText() {
            const text = document.getElementById('textInput').value;
            const status = document.getElementById('statusText');
            const downloadLink = document.getElementById('downloadText');
            status.textContent = '⏳ جاري التحويل...';
            const tempDiv = document.createElement('div');
            tempDiv.style.width = '210mm'; tempDiv.style.padding = '20mm';
            tempDiv.style.fontSize = '16pt'; tempDiv.style.fontFamily = 'Arial, sans-serif';
            tempDiv.style.lineHeight = '1.8'; tempDiv.style.textAlign = 'right';
            tempDiv.style.direction = 'rtl'; tempDiv.style.whiteSpace = 'pre-wrap';
            tempDiv.textContent = text;
            document.body.appendChild(tempDiv);
            try {
                const canvas = await html2canvas(tempDiv, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
                document.body.removeChild(tempDiv);
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                const imgProps = pdf.getImageProperties(imgData);
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                const pdfBlob = pdf.output('blob');
                const url = URL.createObjectURL(pdfBlob);
                downloadLink.href = url;
                downloadLink.style.display = 'inline-block';
                status.textContent = '✅ تم التحويل بنجاح!';
            } catch (error) {
                status.textContent = '❌ حدث خطأ. حاول مرة أخرى.';
                if (tempDiv.parentNode) document.body.removeChild(tempDiv);
            }
        }

        // الأداة 3: ضغط الصور
        async function compressImage(quality) {
            const status = document.getElementById('statusCompress');
            const downloadLink = document.getElementById('downloadCompress');
            status.textContent = '⏳ جاري الضغط...';

            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    downloadLink.href = url;
                    downloadLink.style.display = 'inline-block';
                    status.textContent = '✅ تم الضغط بنجاح! الحجم قل بنسبة ' + (100-quality) + '% تقريباً';
                }, 'image/jpeg', quality/100);
            }
            img.src = URL.createObjectURL(compressFile);
        }

        // الأداة 4: تغيير المقاس
        async function resizeImage(newWidth) {
            const status = document.getElementById('statusResize');
            const downloadLink = document.getElementById('downloadResize');
            status.textContent = '⏳ جاري تغيير المقاس...';

            const img = new Image();
            img.onload = function() {
                const ratio = img.height / img.width;
                const canvas = document.createElement('canvas');
                canvas.width = newWidth;
                canvas.height = newWidth * ratio;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    downloadLink.href = url;
                    downloadLink.style.display = 'inline-block';
                    status.textContent = '✅ تم تغيير المقاس بنجاح!';
                }, 'image/jpeg', 0.9);
            }
            img.src = URL.createObjectURL(resizeFile);
        }
    </script>
</body>
</html>
