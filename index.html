<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محول الملفات - 4 أدوات مجانية</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:tahoma;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
.container{max-width:900px;margin:0 auto;background:white;border-radius:20px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
h1{text-align:center;color:#667eea;margin-bottom:10px;font-size:32px}
.subtitle{text-align:center;color:#666;margin-bottom:40px}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:40px}
.card{background:#f8f9ff;border:2px solid #667eea;border-radius:15px;padding:30px;text-align:center;cursor:pointer;transition:0.3s}
.card:hover{transform:translateY(-5px);box-shadow:0 10px 30px rgba(102,126,234,0.3)}
.card h3{color:#333;margin-bottom:10px;font-size:20px}
.card p{color:#666}
.upload{display:none;margin-top:30px}
input,select,button{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:2px solid #ddd;font-size:16px}
button{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;cursor:pointer;font-weight:bold}
button:hover{opacity:0.9}
#result{display:none;text-align:center;margin-top:20px;padding:20px;background:#e8f5e9;border-radius:10px}
footer{text-align:center;margin-top:40px;color:#999}
</style>
</head>
<body>
<div class="container">
<h1>🚀 محول الملفات</h1>
<p class="subtitle">4 أدوات مجانية - اختار اللي عايزه</p>

<div class="tools">
<div class="card" onclick="openTool('img2pdf')">
<h3>📄 صورة إلى PDF</h3>
<p>JPG/PNG → PDF</p>
</div>
<div class="card" onclick="openTool('pdf2img')">
<h3>🖼️ PDF إلى صورة</h3>
<p>PDF → JPG/PNG</p>
</div>
<div class="card" onclick="openTool('compress')">
<h3>📦 ضغط الصور</h3>
<p>قلل الحجم</p>
</div>
<div class="card" onclick="openTool('resize')">
<h3>📐 تغيير المقاس</h3>
<p>كبر أو صغر</p>
</div>
</div>

<div class="upload" id="uploadBox">
<h3 id="toolName" style="text-align:center;color:#667eea;margin-bottom:20px"></h3>
<input type="file" id="fileInput">
<select id="format">
<option value="">اختار الصيغة</option>
<option value="pdf">PDF</option>
<option value="jpg">JPG</option>
<option value="png">PNG</option>
</select>
<button onclick="startConvert()">حول الآن</button>
<div id="result">
<p style="color:green;font-size:18px">✅ تم التحويل بنجاح!</p>
<button onclick="alert('هنا تحميل الملف')">تحميل الملف</button>
<button onclick="reset()" style="background:#999">أداة تانية</button>
</div>
</div>

<footer>صنع بـ ❤️ بواسطة عادل</footer>
</div>

<script>
const LINK = 'https://link-hub.net/6200670/XnSNDzlHKFi1?r=';
let currentTool = '';

function openTool(tool) {
currentTool = tool;
document.querySelector('.tools').style.display = 'none';
document.getElementById('uploadBox').style.display = 'block';
const names = {
img2pdf: '📄 تحويل صورة إلى PDF',
pdf2img: '🖼️ تحويل PDF إلى صورة',
compress: '📦 ضغط الصور',
resize: '📐 تغيير مقاس الصورة'
};
document.getElementById('toolName').textContent = names[tool];
}

function startConvert() {
if(!document.getElementById('fileInput').files[0]) {
alert('اختار ملف الأول');
return;
}
if(!document.getElementById('format').value) {
alert('اختار الصيغة');
return;
}
// نحفظ البيانات
localStorage.setItem('tool', currentTool);
// نروح Linkvertise ونرجع
window.location.href = LINK + encodeURIComponent(window.location.href + '#back');
}

// لما نرجع من Linkvertise
window.onload = function() {
if(window.location.hash === '#back' && localStorage.getItem('tool')) {
document.getElementById('result').style.display = 'block';
localStorage.removeItem('tool');
}
}

function reset() {
window.location.hash = '';
document.getElementById('uploadBox').style.display = 'none';
document.querySelector('.tools').style.display = 'grid';
document.getElementById('result').style.display = 'none';
document.getElementById('fileInput').value = '';
document.getElementById('format').value = '';
}
</script>
</body>
</html>
