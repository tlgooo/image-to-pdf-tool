<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل الصور إلى PDF</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
       .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #667eea; margin-bottom: 10px; font-size: 28px; }
        p { color: #666; margin-bottom: 30px; }
        input[type="file"] {
            display: none;
        }
       .upload-btn {
            background: #667eea;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 16px;
            transition: 0.3s;
        }
       .upload-btn:hover { background: #5568d3; }
        #convertBtn {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            display: none;
            width: 100%;
            transition: 0.3s;
        }
        #convertBtn:hover { background: #218838; }
        #preview { margin-top: 20px; }
        #preview img {
            max-width: 100px;
            margin: 5px;
            border-radius: 8px;
            border: 2px solid #ddd;
        }

        /* صندوق الدعم - الزرار الأصفر */
       .donate-box {
            margin-top: 30px;
            padding: 20px;
            background: #fff8e1;
            border-radius: 12px;
            border: 2px dashed #ffc107;
        }
       .donate-box p {
            margin-bottom: 12px;
            color: #333;
            font-size: 15px;
        }
       .donate-btn {
            display: inline-block;
            background: #ffdd00;
            color: #000;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(255, 221, 0, 0.4);
        }
       .donate-btn:hover {
            background: #ffcc00;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 221, 0, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>تحويل الصور إلى PDF 📄</h1>
        <p>ارفع صورك وحولها ملف PDF واحد بسهولة</p>

        <label for="fileInput" class="upload-btn">اختر الصور</label>
        <input type="file" id="fileInput" multiple accept="image/*">

        <div id="preview"></div>

        <button id="convertBtn">تحويل ل PDF</button>

        <!-- صندوق الدعم -->
        <div class="donate-box">
            <p>💛 لو الأداة عجبتك وفرت عليك وقت</p>
            <a href="https://buymeacoffee.com/adeltlge" target="_blank" rel="noopener" class="donate-btn">
                ادعمني بكوباية قهوة ☕
            </a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const convertBtn = document.getElementById('convertBtn');
        const preview = document.getElementById('preview');
        let images = [];

        fileInput.addEventListener('change', (e) => {
            images = Array.from(e.target.files);
            preview.innerHTML = '';
            images.forEach(file => {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                preview.appendChild(img);
            });
            if(images.length > 0) convertBtn.style.display = 'block';
        });

        convertBtn.addEventListener('click', async () => {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();

            for(let i = 0; i < images.length; i++) {
                const img = await loadImage(images[i]);
                const width = pdf.internal.pageSize.getWidth();
                const height = (img.height * width) / img.width;

                if(i > 0) pdf.addPage();
                pdf.addImage(img, 'JPEG', 0, 0, width, height);
            }

            pdf.save('images-to-pdf.pdf');
        });

        function loadImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
