<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تحويل صورة إلى PDF</title>
<style>
body{font-family:tahoma;text-align:center;padding:50px;background:#f5f5f5}
.box{background:white;padding:40px;border-radius:15px;max-width:500px;margin:auto;box-shadow:0 5px 20px rgba(0,0,0,0.1)}
h1{color:#667eea}
input,select,button{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:2px solid #ddd;font-size:16px}
button{background:#667eea;color:white;border:none;cursor:pointer;font-weight:bold}
button:hover{background:#764ba2}
#result{display:none;margin-top:20px}
</style>
</head>
<body>
<div class="box">
<h1>📄 تحويل صورة إلى PDF</h1>
<p>ارفع الصورة وهنحولها PDF بعد الإعلان</p>

<input type="file" id="file" accept="image/*">
<button onclick="goAd()">حول إلى PDF</button>

<div id="result">
<p style="color:green;font-size:20px">✅ تم التحويل!</p>
<button onclick="alert('هنا هينزل ملف PDF')">تحميل PDF</button>
</div>
</div>

<script>
// حط لينك Linkvertise بتاعك هنا
const LINK = 'https://link-hub.net/6200670/XnSNDzlHKFi1?r=';

function goAd() {
if(!document.getElementById('file').files[0]) {
alert('اختار صورة الأول');
return;
}
// نحفظ إن المستخدم اختار ملف
localStorage.setItem('hasFile', 'yes');
// نروح الإعلان ونرجع لنفس الصفحة
window.location.href = LINK + encodeURIComponent(window.location.href + '#done');
}

// لما نرجع من الإعلان
if(window.location.hash === '#done' && localStorage.getItem('hasFile') === 'yes') {
document.getElementById('result').style.display = 'block';
localStorage.removeItem('hasFile');
}
</script>
</body>
</html>
