            أدوات تحويل PDF</h1>
        <div style="margin: 20px 0;">
    <div style="max-width: 600px; margin: 20px auto; position: relative;">
    <div style="display: flex; overflow: hidden; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 20px 0;">
<div style="display: flex; gap: 10px; justify-content: center; margin: 20px 0;">
   
</div>
</div>
    </div>
    <div style="text-align: center; margin-top: 10px;">
        <button onclick="showImage(0)" style="background:#1a237e; color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">1</button>
        <button onclick="showImage(1)" style="background:#1a237e; color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">2</button>

        <button onclick="showImage(3)" style="background:#1a237e; color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">4</button>

</div>

<script>
    let currentIndex = 0;
    const images = document.querySelectorAll('.slider-img');

    function showImage(index) {
        images.forEach(img => img.style.display = 'none');
        images[index].style.display = 'block';
        currentIndex = index;
    }

    // Auto slide every 3 seconds
    setInterval(() => {
        currentIndex = (currentIndex + 1) % images.length;
        showImage(currentIndex);
    }, 3000);

    // Show first image
    showImage(0);
</script>
</div>
        <!-- القسم الأول: تحويل الصور -->
        <div class="section">
            <h2>🖼️ تحويل الصور إلى PDF</h2>
            <p>اختر الصور التي تريد تحويلها إلى ملف PDF واحد</p>
            <input type="file" id="imageInput" accept="image/*" multiple>
            <div id="preview"></div>
            <button onclick="convertImagesToPDF()">🔄 تحويل الصور</button>
            <div id="statusImages"></div>
            <a id="downloadImages" download="images.pdf">📥 تحميل PDF</a>
        </div>

        <!-- القسم الثاني: تحويل النص -->
        <div class="section">
            <h2>📝 تحويل النص إلى PDF</h2>
            <p>اكتب النص العربي أو الإنجليزي الذي تريد تحويله</p>
            <textarea id="textInput" placeholder="اكتب نصك هنا..."></textarea>
            <button onclick="convertTextToPDF()">🔄 تحويل النص</button>
            <div id="statusText"></div>
            <a id="downloadText" download="text.pdf">📥 تحميل PDF</a>
        </div>
    </div>

    <script>
        // ====== أداة تحويل الصور ======
        let selectedFiles = [];

        document.getElementById('imageInput').addEventListener('change', function(e) {
            selectedFiles = Array.from(e.target.files);
            const preview = document.getElementById('preview');
            preview.innerHTML = '';
            selectedFiles.forEach(file => {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                preview.appendChild(img);
            });
        });

        async function convertImagesToPDF() {
            if (selectedFiles.length === 0) {
                alert('رجاء اختر صورة واحدة على الأقل.');
                return;
            }

            const status = document.getElementById('statusImages');
            const downloadLink = document.getElementById('downloadImages');
            status.textContent = '⏳ جاري التحويل...';

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                const imgData = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });

                if (i > 0) pdf.addPage();
                const imgProps = pdf.getImageProperties(imgData);
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
            }

            const pdfBlob = pdf.output('blob');
            const url = URL.createObjectURL(pdfBlob);
            downloadLink.href = url;
            downloadLink.style.display = 'inline-block';
            status.textContent = '✅ تم التحويل بنجاح!';
        }

        // ====== أداة تحويل النص (تدعم العربية) ======
        async function convertTextToPDF() {
            const text = document.getElementById('textInput').value;
            if (text.trim() === '') {
                alert('رجاء اكتب نصاً أولاً.');
                return;
            }

            const status = document.getElementById('statusText');
            const downloadLink = document.getElementById('downloadText');
            status.textContent = '⏳ جاري التحويل...';

            // إنشاء عنصر مؤقت لعرض النص
            const tempDiv = document.createElement('div');
            tempDiv.style.width = '210mm';
            tempDiv.style.padding = '20mm';
            tempDiv.style.fontSize = '16pt';
            tempDiv.style.fontFamily = 'Arial, sans-serif';
            tempDiv.style.lineHeight = '1.8';
            tempDiv.style.textAlign = 'right';
            tempDiv.style.direction = 'rtl';
            tempDiv.style.whiteSpace = 'pre-wrap';
            tempDiv.style.wordWrap = 'break-word';
            tempDiv.textContent = text;

            document.body.appendChild(tempDiv);

            try {
                // تحويل النص إلى صورة باستخدام html2canvas
                const canvas = await html2canvas(tempDiv, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff'
                });

                // إزالة العنصر المؤقت
                document.body.removeChild(tempDiv);

                // إنشاء PDF وإضافة الصورة
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                const imgProps = pdf.getImageProperties(imgData);
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);

                const pdfBlob = pdf.output('blob');
                const url = URL.createObjectURL(pdfBlob);
                downloadLink.href = url;
                downloadLink.style.display = 'inline-block';
                status.textContent = '✅ تم التحويل بنجاح!';
            } catch (error) {
                status.textContent = '❌ حدث خطأ. حاول مرة أخرى.';
                console.error(error);
                // إزالة العنصر المؤقت في حالة الخطأ
                if (tempDiv.parentNode) document.body.removeChild(tempDiv);
            }
        }
    </script>

</body>
