<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تحويل صورة إلى PDF - 5 ثواني فقط</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:tahoma;text-align:center;padding:30px;background:#f0f4f8}
.box{background:white;padding:30px;border-radius:15px;max-width:500px;margin:auto;box-shadow:0 5px 20px rgba(0,0,0,0.1)}
input{width:100%;padding:12px;margin:15px 0;border:2px dashed #1a237e;border-radius:10px}
button{background:#1a237e;color:white;padding:15px;border:none;border-radius:8px;width:100%;font-size:18px;cursor:pointer;font-weight:bold}
.instruction{background:#e8f5e9;border:2px solid #4caf50;border-radius:10px;padding:15px;margin:15px 0;font-size:16px;color:#2e7d32}
.arrow{font-size:40px;animation:blink 1s infinite;color:#4caf50}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
#loading{display:none;margin-top:20px}
#result{display:none;margin-top:20px}
</style>
</head>
<body>
<div class="box">
<h1>📄 تحويل صورة إلى PDF</h1>

<input type="file" id="file" accept="image/*">

<div class="instruction">
ادعم الموقع بـ 5 ثواني فقط ⏱️<br>
دوس الزرار → استنى 5 ثواني → دوس <b style="color:red">Skip Ad</b> → ارجع خد ملفك
<div class="arrow">⬇️</div>
</div>

<button onclick="start()">🔄 تحويل الآن</button>

<div id="loading">
<p style="font-size:18px;color:#1a237e">⏳ جاري التحويل...</p>
</div>

<div id="result">
<p style="color:green;font-size:22px">✅ تم!</p>
<a id="download" download="file.pdf" style="font-size:18px">📥 تحميل PDF</a>
</div>
</div>

<script>
// الكود بتاعك من ShrinkMe
const LINK = 'https://shrinkme.io/460dd0268d0f06f1bb5e4e5c89b3816a2bf3b92d?r=';

function start() {
if(!document.getElementById('file').files[0]) {
alert('اختار صورة الأول');
return;
}

const file = document.getElementById('file').files[0];
const reader = new FileReader();
reader.onload = function(e) {
localStorage.setItem('fileData', e.target.result);
// نروح ShrinkMe 5 ثواني ونرجع
window.location.href = LINK + encodeURIComponent(window.location.href + '#done');
}
reader.readAsDataURL(file);

document.getElementById('loading').style.display = 'block';
}

// لما نرجع بعد 5 ثواني
window.onload = async function() {
if(window.location.hash === '#done' && localStorage.getItem('fileData')) {
const imgData = localStorage.getItem('fileData');
localStorage.removeItem('fileData');

const { jsPDF } = window.jspdf;
const pdf = new jsPDF();
const imgProps = pdf.getImageProperties(imgData);
const pdfWidth = pdf.internal.pageSize.getWidth();
const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);

const pdfBlob = pdf.output('blob');
const url = URL.createObjectURL(pdfBlob);
document.getElementById('loading').style.display = 'none';
document.getElementById('result').style.display = 'block';
document.getElementById('download').href = url;
}
</script>
</body>
</html>
