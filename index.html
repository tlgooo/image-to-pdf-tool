<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>4 أدوات PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
body{font-family:tahoma;background:linear-gradient(135deg,#667eea,#764ba2);padding:30px;min-height:100vh}
.box{background:white;border-radius:25px;padding:35px;max-width:600px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
h1{color:#667eea;text-align:center;margin-bottom:10px}
.tool{border:2px solid #eee;border-radius:15px;padding:25px;margin:20px 0}
.tool h3{color:#764ba2;margin-bottom:10px}
input{width:100%;padding:12px;border:2px dashed #667eea;border-radius:10px;margin:15px 0}
button{width:100%;padding:15px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer}
#adBox{display:none;background:#FFF8DC;border:3px solid #FFD700;border-radius:15px;padding:25px;margin:20px 0;text-align:center}
#adBox a{display:block;background:linear-gradient(135deg,#FF0000,#CC0000);color:white;padding:20px;border-radius:12px;text-decoration:none;font-size:20px;font-weight:bold;margin:15px 0}
#result{display:none;text-align:center;margin-top:20px}
#download{background:linear-gradient(135deg,#00C853,#00B248);color:white;padding:15px 40px;border-radius:12px;text-decoration:none;font-weight:bold;font-size:18px;display:inline-block}
</style>
</head>
<body>
<div class="box">
<h1>✨ أدوات PDF الاحترافية</h1>

<div id="tools">
<div class="tool">
<h3>1. صورة → PDF</h3>
<input type="file" id="imgFile" accept="image/*">
<button onclick="prepare('img')">تحويل PDF</button>
</div>

<div class="tool">
<h3>2. PDF → صورة</h3>
<input type="file" id="pdfFile" accept=".pdf">
<button onclick="prepare('pdf2img')">تحويل صورة</button>
</div>

<div class="tool">
<h3>3. ضغط PDF</h3>
<input type="file" id="compressFile" accept=".pdf">
<button onclick="prepare('compress')">ضغط الآن</button>
</div>

<div class="tool">
<h3>4. دمج PDF</h3>
<input type="file" id="mergeFile" accept=".pdf" multiple>
<button onclick="prepare('merge')">دمج الآن</button>
</div>
</div>

<div id="adBox">
<h3 style="color:#B8860B;margin-bottom:15px">⚠️ خطوة إجبارية للتحميل</h3>
<p style="margin-bottom:15px;font-size:16px">لازم تدوس على الإعلان ده الأول</p>
<a href="https://ouo.io/zGgJKG" target="_blank" rel="noopener">🎯 دوس هنا لفتح الإعلان وكسب النقاط</a>
<p style="color:#8B6914;font-size:14px;margin:15px 0">بعد ما يفتح الإعلان ارجع هنا ودوس</p>
<button onclick="doConvert()" style="background:linear-gradient(135deg,#00C853,#00B248)">✅ كمل التحويل والتحميل</button>
</div>

<div id="result">
<p style="color:#00C853;font-size:24px;font-weight:bold">✅ تم بنجاح!</p>
<a id="download" download="file.pdf">📥 تحميل الملف</a>
</div>
</div>

<script>
let currentTool = '';
let currentFile = '';
let currentFiles = [];

function prepare(tool) {
currentTool = tool;
if(tool === 'img') {
currentFile = document.getElementById('imgFile').files[0];
if(!currentFile) return alert('اختار صورة الأول');
}
if(tool === 'pdf2img') {
currentFile = document.getElementById('pdfFile').files[0];
if(!currentFile) return alert('اختار PDF الأول');
}
if(tool === 'compress') {
currentFile = document.getElementById('compressFile').files[0];
if(!currentFile) return alert('اختار PDF الأول');
}
if(tool === 'merge') {
currentFiles = document.getElementById('mergeFile').files;
if(currentFiles.length < 2) return alert('اختار ملفين PDF على الأقل');
}

document.getElementById('tools').style.display = 'none';
document.getElementById('adBox').style.display = 'block';
}

async function doConvert() {
document.getElementById('adBox').style.display = 'none';

const { jsPDF } = window.jspdf;
const { PDFDocument } = PDFLib;

try {
if(currentTool === 'img') {
const img = new Image();
img.onload = () => {
const pdf = new jsPDF({orientation: img.width > img.height? 'landscape' : 'portrait'});
const w = pdf.internal.pageSize.getWidth();
const h = pdf.internal.pageSize.getHeight();
pdf.addImage(img, 'JPEG', 0, 0, w, h);
const blob = pdf.output('blob');
showResult(URL.createObjectURL(blob), currentFile.name.replace(/\.[^/.]+$/, "") + '.pdf');
};
img.src = URL.createObjectURL(currentFile);
}

if(currentTool === 'pdf2img') {
alert('⚠️ تحويل PDF لصورة محتاج مكتبة pdf.js و GitHub حاظرها\nالحل: استخدم استضافة Netlify عشان تشتغل');
// مؤقتاً نحول لصورة فاضية
const canvas = document.createElement('canvas');
canvas.width = 800; canvas.height = 600;
canvas.getContext('2d').fillText('Demo Image', 50, 50);
canvas.toBlob(blob => {
showResult(URL.createObjectURL(blob), 'page.jpg');
});
}

if(currentTool === 'compress') {
const pdfData = await currentFile.arrayBuffer();
const pdf = await PDFDocument.load(pdfData);
const pdfBytes = await pdf.save({useObjectStreams: false});
const blob = new Blob([pdfBytes], {type: 'application/pdf'});
showResult(URL.createObjectURL(blob), 'compressed_' + currentFile.name);
}

if(currentTool === 'merge') {
const mergedPdf = await PDFDocument.create();
for(let file of currentFiles) {
const pdfData = await file.arrayBuffer();
const pdf = await PDFDocument.load(pdfData);
const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
copiedPages.forEach(page => mergedPdf.addPage(page));
}
const pdfBytes = await mergedPdf.save();
const blob = new Blob([pdfBytes], {type: 'application/pdf'});
showResult(URL.createObjectURL(blob), 'merged.pdf');
}
} catch(e) {
alert('خطأ: ' + e.message);
document.getElementById('tools').style.display = 'block';
}
}

function showResult(url, name) {
document.getElementById('result').style.display = 'block';
document.getElementById('download').href = url;
document.getElementById('download').download = name;
}
</script>
</body>
</html>
