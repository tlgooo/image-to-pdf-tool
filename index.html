<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحويل صورة إلى PDF - 5 ثواني</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:tahoma;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:white;padding:35px;border-radius:20px;max-width:450px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
h1{color:#1a237e;margin-bottom:25px;font-size:24px;text-align:center}
input{width:100%;padding:14px;margin:15px 0;border:2px dashed #1a237e;border-radius:12px;background:#f8f9fa;cursor:pointer;font-size:15px}
button{background:#1a237e;color:white;padding:16px;border:none;border-radius:12px;width:100%;font-size:18px;cursor:pointer;font-weight:bold;margin-top:10px}
button:hover{background:#283593}
.instruction{background:#e8f5e9;border:2px solid #4caf50;border-radius:12px;padding:18px;margin:20px 0;font-size:15px;color:#2e7d32;line-height:2;text-align:right}
.arrow{font-size:35px;animation:blink 1s infinite;color:#4caf50;text-align:center;margin-top:10px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
#loading{display:none;text-align:center;margin-top:20px;font-size:18px;color:#1a237e}
#result{display:none;text-align:center;margin-top:20px}
#download{display:inline-block;background:#4caf50;color:white;padding:14px 30px;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:10px;font-size:18px}
.error{background:#ffebee;border:2px solid #f44336;color:#c62828;padding:15px;border-radius:10px;margin:15px 0;display:none;text-align:center}
</style>
</head>
<body>
<div class="box">
<h1>تحويل صورة إلى PDF 📄</h1>

<input type="file" id="file" accept="image/*">

<div class="instruction">
⏱️ <b>ادعم الموقع بـ 5 ثواني فقط</b><br>
1. دوس الزرار الأزرق تحت<br>
2. استنى 5 ثواني في صفحة الإعلان<br>
3. دوس <span style="color:red;font-weight:bold">Skip Ad</span><br>
4. هترجع هنا والملف جاهز للتحميل
<div class="arrow">⬇️</div>
</div>

<button onclick="start()">تحويل الآن 🔄</button>

<div id="loading">⏳ جاري التحويل بعد الإعلان...</div>
<div id="error" class="error"></div>

<div id="result">
<p style="color:#4caf50;font-size:24px;margin-bottom:10px">✅ تم التحويل بنجاح!</p>
<a id="download" download="converted.pdf">📥 اضغط هنا لتحميل PDF</a>
</div>
</div>

<script>
// اللينك بتاعك محطوط هنا خلاص متعدلش حاجة
const LINK = 'https://shrinkme.io/1PxO?r=';

function start() {
const file = document.getElementById('file').files[0];
document.getElementById('error').style.display = 'none';

if(!file) {
alert('⚠️ اختار صورة الأول من فوق');
return;
}

const reader = new FileReader();
reader.onload = function(e) {
sessionStorage.setItem('imgData', e.target.result);
sessionStorage.setItem('fileName', file.name);
const returnUrl = window.location.href.split('#')[0] + '#done';
window.location.href = LINK + encodeURIComponent(returnUrl);
}
reader.readAsDataURL(file);
document.getElementById('loading').style.display = 'block';
}

window.onload = async function() {
if(window.location.hash === '#done') {
const imgData = sessionStorage.getItem('imgData');
const fileName = sessionStorage.getItem('fileName');

if(!imgData) {
document.getElementById('error').innerHTML = '❌ الصورة ضاعت! جرب تاني ومتقفلش المتصفح وانت في الإعلان';
document.getElementById('error').style.display = 'block';
return;
}

sessionStorage.removeItem('imgData');
sessionStorage.removeItem('fileName');

const { jsPDF } = window.jspdf;
const pdf = new jsPDF();
const img = new Image();
img.onload = function() {
const pageWidth = pdf.internal.pageSize.getWidth();
const pageHeight = pdf.internal.pageSize.getHeight();
const imgRatio = img.width / img.height;
const pageRatio = pageWidth / pageHeight;

let finalWidth, finalHeight;
if(imgRatio > pageRatio) {
finalWidth = pageWidth;
finalHeight = pageWidth / imgRatio;
} else {
finalHeight = pageHeight;
finalWidth = pageHeight * imgRatio;
}

const x = (pageWidth - finalWidth) / 2;
const y = (pageHeight - finalHeight) / 2;

pdf.addImage(imgData, 'JPEG', x, y, finalWidth, finalHeight);
const pdfBlob = pdf.output('blob');
const url = URL.createObjectURL(pdfBlob);

document.getElementById('loading').style.display = 'none';
document.getElementById('result').style.display = 'block';
document.getElementById('download').href = url;
document.getElementById('download').download = fileName.replace(/\.[^/.]+$/, "") + '.pdf';
}
img.src = imgData;
}
</script>
</body>
</html>
