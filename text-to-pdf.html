<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل النص إلى PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            text-align: center;
            padding: 50px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 { color: #1a237e; }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            border: 2px dashed #1a237e;
            border-radius: 10px;
            font-size: 16px;
            margin: 20px 0;
        }
        button {
            background: #1a237e;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #283593; }
        #status { margin-top: 20px; font-weight: bold; }
        #download { display: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 تحويل النص إلى PDF</h1>
        <p>اكتب النص الذي تريد تحويله إلى PDF</p>
        <textarea id="textInput" placeholder="اكتب نصك هنا..."></textarea>
        <button onclick="convertTextToPDF()">🔄 تحويل إلى PDF</button>
        <div id="status"></div>
        <a id="download" download="text.pdf">📥 تحميل PDF</a>
    </div>

    <script>
        async function convertTextToPDF() {
            const text = document.getElementById('textInput').value;
            if (text.trim() === '') {
                alert('رجاء اكتب نصاً أولاً.');
                return;
            }

            const status = document.getElementById('status');
            const downloadLink = document.getElementById('download');
            status.textContent = '⏳ جاري التحويل...';

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            const lines = text.split('\n');
            let y = 20;

            pdf.setFontSize(14);
            for (let i = 0; i < lines.length; i++) {
                if (y > 270) {
                    pdf.addPage();
                    y = 20;
                }
                pdf.text(lines[i], 10, y);
                y += 10;
            }

            const pdfBlob = pdf.output('blob');
            const url = URL.createObjectURL(pdfBlob);
            downloadLink.href = url;
            downloadLink.style.display = 'inline-block';
            status.textContent = '✅ تم التحويل بنجاح!';
        }
    </script>
</body>
</html>
